server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: marketplace
    password: marketplace
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update       # use 'validate' in production
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  threads:
    virtual:
      enabled: true          # Java 25 Virtual Threads

# JWT config — move these to environment variables / Vault in production
jwt:
  secret: "your-256-bit-secret-key-replace-this-in-production-use-env-var"
  access-token-expiry-ms: 900000      # 15 minutes
  refresh-token-expiry-ms: 2592000000 # 30 days

management:
  endpoints:
    web:
      exposure:
        include: health, info