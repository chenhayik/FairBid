

services:
  marketplace-auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: auth-service:latest
    container_name: auth-service
    networks:
    - marketplace-net
    restart: on-failure

    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_DATASOURCE_URL=jdbc:postgresql://marketplace-auth-db:5432/auth-db
      - SPRING_DATASOURCE_USERNAME=admin_user
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_SQL_INIT_MODE=never
      - JWT_SECRET=x8aRLBjC1V9Tz1IuE3o47gCN88TwOiD4g2KuJX5u6H7EJ5PSpvnM0NYlcbL0W3Dc

#healthcheck Already in docker file
#    healthcheck:
#      test: [ "CMD", "wget", "-f", "http://localhost:8081/actuator/health" ]
#      interval: 30s
#      timeout: 10s
#      retries: 3
#      start_period: 60s  # increase this

    depends_on:
      marketplace-auth-db:
        condition: service_healthy


  marketplace-auth-db:
    image: postgres:17
    container_name: marketplace-auth-db
    restart: always
    environment:
      POSTGRES_DB: auth-db
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password
    ports:
      - "5001:5432"
    volumes:
      #      - patient-management-data:/var/lib/postgresql/data
      - ./db_volumes/auth-service-db:/var/lib/postgresql
    networks:
      - marketplace-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d auth-db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  marketplace-kafka1:
    image: bitnami/kafka
    container_name: marketplace-kafka1
    ports:
      - "9094:9094"
    environment:
#      KRAft Settings
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@marketplace-kafka1:9093, 2@marketplace-kafka2:9093, 3@marketplace-kafka3:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
#  Listener Settings
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9096
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://:marketplace-kafka1:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT

#    Cluster Settings
      - KAFKA_KRAFT_CLUSTER_ID=CLUSTER_ID_1
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_CFG_MIN_INSYNC_REPLICAS=2
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3

  marketplace-kafka2:
    image: bitnami/kafka
    container_name: marketplace-kafka2
    ports:
      - "9095:9095"
    environment:
      #      KRAft Settings
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@marketplace-kafka1:9093, 2@marketplace-kafka2:9093, 3@marketplace-kafka3:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      #  Listener Settings
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9096
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://:marketplace-kafka1:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT

      #    Cluster Settings
      - KAFKA_KRAFT_CLUSTER_ID=CLUSTER_ID_1
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_CFG_MIN_INSYNC_REPLICAS=2
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3

  marketplace-kafka3:
    image: bitnami/kafka
    container_name: marketplace-kafka3
    ports:
      - "9096:9096"
    environment:
      #      KRAft Settings
      - KAFKA_CFG_NODE_ID=3
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@marketplace-kafka1:9093, 2@marketplace-kafka2:9093, 3@marketplace-kafka3:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      #  Listener Settings
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9096
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://:marketplace-kafka1:9092,EXTERNAL://localhost:909
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT

      #    Cluster Settings
      - KAFKA_KRAFT_CLUSTER_ID=CLUSTER_ID_1
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_CFG_MIN_INSYNC_REPLICAS=2
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    ports:
      - "9090:9090"
    environment:
      - KAFKA_CLUSTERS_0_NAME=localCluster
      - KAFKA_CLUSTER_)_BOOTSTRAPSERVERS=marketplace-kafka1:9092,marketplace-kafka2:9092,marketplace-kafka3:9092
    depends_on:
      - marketplace-kafka1
      - marketplace-kafka2
      - marketplace-kafka3











